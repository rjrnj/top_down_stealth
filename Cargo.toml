[package]
name = "top_down_stealth"
version = "0.1.0"
edition = "2024"

[dependencies]
bevy = "0.20.0"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
# Compile the entire crate as one unit.
# Slows compile times, marginal improvements.
codegen-units = 1
# Do a second optimization pass over the entire program, including dependencies
# Slows compile times, marginal improvements.
lto = "thin"

# Uncomment to disable detailed log levels on compile time so they do not need
# to be filtered out while the app is running.
# log = { version = "*", features = ["max_level_debug", "release_max_level_warn"] }
